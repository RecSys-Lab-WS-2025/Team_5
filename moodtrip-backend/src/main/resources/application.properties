spring.application.name=moodtrip-backend
spring.config.import=optional:file:.env[.properties]

spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moodtrip}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}

spring.liquibase.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moodtrip}
spring.liquibase.user=${DB_USERNAME:postgres}
spring.liquibase.password=${DB_PASSWORD:postgres}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml


spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.options.model=deepseek-chat
spring.ai.deepseek.chat.options.temperature=0.8

spotify.client-id=${SPOTIFY_CLIENT_ID}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET}
spotify.redirect-uri=http://127.0.0.1:8080/api/spotify/callback
spotify.auth-url=https://accounts.spotify.com/authorize
spotify.api-base-url=https://api.spotify.com/v1
spotify.scopes=user-read-private,user-read-email,playlist-read-private,playlist-read-collaborative,user-top-read,playlist-modify-public,playlist-modify-private

# Frontend Configuration
frontend.url=http://localhost:5173

app.jwt.secret=${JWT_SECRET:ThisIsAStrongDefaultJwtSecretKey_ChangeMe_9876543210}

app.jwt.expiration-minutes=${JWT_EXPIRATION:60}
app.jwt.issuer=${JWT_ISSUER:moodtrip-backend}

# Algorithm parameters for computing the per-user preference offset.
# learning-rate: step size for updating the user preference offset.
#   - Higher values speed up learning but can make offsets unstable.
#   - Typical range: 0.001–0.1. Default: 0.05.
app.user-preference-offset.learning-rate=0.05
# regularization: L2 penalty strength applied to the learned offset to prevent overfitting.
#   - Higher values keep offsets closer to zero (more conservative personalization).
#   - Typical range: 1e-6–1e-1. Default: 0.001.
app.user-preference-offset.regularization=0.001
# shrinkage-k: shrinkage factor used when estimating the offset from limited data.
#   - Higher values increase shrinkage toward the global average (more conservative offsets).
#   - Lower values rely more on the user's own data (more personalized but noisier).
#   - Typical range: 5.0–50.0. Default: 20.0.
app.user-preference-offset.shrinkage-k=20.0
# offset-min / offset-max: hard bounds applied to the final user preference offset.
#   - Offsets are clamped into [offset-min, offset-max] after updates.
#   - Use narrower ranges for safer, more moderate personalization.
app.user-preference-offset.offset-min=-2.0
app.user-preference-offset.offset-max=2.0

