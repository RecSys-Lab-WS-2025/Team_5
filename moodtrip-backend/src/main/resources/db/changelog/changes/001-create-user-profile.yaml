databaseChangeLog:
  - changeSet:
      id: 0001-create-user-profile
      author: moodtrip
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_profile
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
        - createIndex:
            tableName: user_profile
            indexName: idx_user_profile_username
            columns:
              - column:
                  name: username
        - createIndex:
            tableName: user_profile
            indexName: idx_user_profile_email
            columns:
              - column:
                  name: email
