databaseChangeLog:
  - changeSet:
      id: 0005-create-route-recommendation
      author: moodtrip
      changes:
        - createTable:
            tableName: route_recommendation
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_route_recommendation
              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: route_data
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
        - addForeignKeyConstraint:
            baseTableName: route_recommendation
            baseColumnNames: conversation_id
            referencedTableName: conversation
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_route_recommendation_conversation
        - createIndex:
            tableName: route_recommendation
            indexName: idx_route_recommendation_conversation_id
            columns:
              - column:
                  name: conversation_id
