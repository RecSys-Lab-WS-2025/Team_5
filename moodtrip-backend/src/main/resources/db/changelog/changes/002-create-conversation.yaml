databaseChangeLog:
  - changeSet:
      id: 0002-create-conversation
      author: moodtrip
      changes:
        - createTable:
            tableName: conversation
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_conversation
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: emotion
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
        - addForeignKeyConstraint:
            baseTableName: conversation
            baseColumnNames: user_id
            referencedTableName: spotify_tokens
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_conversation_user
        - createIndex:
            tableName: conversation
            indexName: idx_conversation_user_id
            columns:
              - column:
                  name: user_id
