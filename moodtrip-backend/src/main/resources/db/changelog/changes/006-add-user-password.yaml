databaseChangeLog:
  - changeSet:
      id: 0006-add-user-password
      author: moodtrip
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_profile
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
              - column:
                  name: password_hash
                  type: TEXT
                  constraints:
                    nullable: true
