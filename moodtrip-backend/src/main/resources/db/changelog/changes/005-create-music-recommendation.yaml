databaseChangeLog:
  - changeSet:
      id: 0005-create-music-recommendation
      author: moodtrip
      changes:
        - createTable:
            tableName: music_recommendation
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_music_recommendation
              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: link
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
        - addForeignKeyConstraint:
            baseTableName: music_recommendation
            baseColumnNames: conversation_id
            referencedTableName: conversation
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_music_recommendation_conversation
        - createIndex:
            tableName: music_recommendation
            indexName: idx_music_recommendation_conversation_id
            columns:
              - column:
                  name: conversation_id
