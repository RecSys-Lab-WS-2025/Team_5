databaseChangeLog:
  - changeSet:
      id: 0001-create-user-profile
      author: moodtrip
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_profile
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
        - createIndex:
            tableName: user_profile
            indexName: idx_user_profile_username
            columns:
              - column:
                  name: username
        - createIndex:
            tableName: user_profile
            indexName: idx_user_profile_email
            columns:
              - column:
                  name: email

  - changeSet:
      id: 0002-create-conversation
      author: moodtrip
      changes:
        - createTable:
            tableName: conversation
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_conversation
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: emotion
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
        - createIndex:
            tableName: conversation
            indexName: idx_conversation_user_id
            columns:
              - column:
                  name: user_id
        - addForeignKeyConstraint:
            baseTableName: conversation
            baseColumnNames: user_id
            referencedTableName: user_profile
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_conversation_user_profile

  - changeSet:
      id: 0003-create-message
      author: moodtrip
      changes:
        - createTable:
            tableName: message
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_message
              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sender
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
        - addForeignKeyConstraint:
            baseTableName: message
            baseColumnNames: conversation_id
            referencedTableName: conversation
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_message_conversation
        - createIndex:
            tableName: message
            indexName: idx_message_conversation_id
            columns:
              - column:
                  name: conversation_id

  - changeSet:
      id: 0004-create-recommendation
      author: moodtrip
      changes:
        - createTable:
            tableName: recommendation
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_recommendation
              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: link
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
        - addForeignKeyConstraint:
            baseTableName: recommendation
            baseColumnNames: conversation_id
            referencedTableName: conversation
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_recommendation_conversation
        - createIndex:
            tableName: recommendation
            indexName: idx_recommendation_conversation_id
            columns:
              - column:
                  name: conversation_id
        - createIndex:
            tableName: recommendation
            indexName: idx_recommendation_conversation_type
            columns:
              - column:
                  name: conversation_id
              - column:
                  name: type

  - changeSet:
      id: 0005-create-spotify-tokens
      author: moodtrip
      changes:
        - createTable:
            tableName: spotify_tokens
            columns:
              - column:
                  name: user_id
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_spotify_tokens
              - column:
                  name: access_token
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: refresh_token
                  type: TEXT
              - column:
                  name: expires_in
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fetched_at
                  type: BIGINT
                  constraints:
                    nullable: false
        - createIndex:
            tableName: spotify_tokens
            indexName: idx_spotify_tokens_user_id
            columns:
              - column:
                  name: user_id
