name: Lint, Build & Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moodtrip-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Lint & Build
        run: ./gradlew clean build --stacktrace

      - name: Run Gradle Checkstyle and SpotBugs
        run: ./gradlew checkstyleMain spotbugsMain


  # ⚙️ 前端 Lint 检查
  frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moodtrip-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Prettier check (optional)
        run: npx prettier --check .