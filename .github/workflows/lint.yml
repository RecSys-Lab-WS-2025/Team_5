name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  backend-lint:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_TOKEN: ${{ secrets.SPOTIFY_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x moodtrip-backend/gradlew
        working-directory: .
      
      - name: Build and test backend
        run: ./gradlew build test
        working-directory: moodtrip-backend
      
      - name: Run SpotBugs
        run: ./gradlew spotbugsMain spotbugsTest
        working-directory: moodtrip-backend
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: moodtrip-backend/build/test-results/test/*.xml
          retention-days: 7

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: moodtrip-frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: moodtrip-frontend
      
      - name: Run ESLint
        run: npm run lint
        working-directory: moodtrip-frontend
      
      - name: Type check
        run: npx tsc --noEmit
        working-directory: moodtrip-frontend
      
      - name: Build frontend
        run: npm run build
        working-directory: moodtrip-frontend